
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textora - Text Editor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(120deg, #d9bdf9, #91c5fa);
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 25px 20px 50px;
}

h1 {
    color: #39245f;
    font-size: 45px;
    margin-bottom: 15px;
}

p {
    color: #555;
    font-size: 22px;
    margin-bottom: 50px;
}

.box {
    width: 320px;
    height: 375px;
    background: white;
    margin: auto;
    padding: 20px;
    border-radius: 20px;
    text-align: left;
    font-size: 18px;
    outline: none;
    overflow-y: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 5px;
}

.card {
    width: 320px;
    min-height: 163px;
    background: white;
    border-radius: 19px;
    padding: 25px 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.card h2 {
    color: #39245f;
    font-size: 23px;
    font-weight: normal;
    margin-bottom: 22px;
}

.color-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid #ddd;
    margin: 7px;
    cursor: pointer;
}

.color-btn:hover {
    transform: scale(1.2);
}

.font-btn {
    padding: 8px 12px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    background: #eee6fa;
    color: #39245f;
    cursor: pointer;
    font-size: 14px;
}

.font-btn:hover {
    background: #cbb2ed;
}

@media(max-width: 600px) {
    h1 {
        font-size: 35px;
    }

    p {
        font-size: 17px;
        margin-bottom: 30px;
    }

    .box {
        width: 90%;
        height: 300px;
    }

    .container {
        gap: 20px;
    }

    .card {
        width: 90%;
    }
}
</style>
</head>

<body>

<h1>Textora</h1>
<p>Edit your thoughts freely</p>

<div class="box" contenteditable="true" id="editor"></div>
<div class="container">

    <div class="card">
        <h2>Background Color</h2>

        <button class="color-btn" style="background:#7042a5" onclick="changeBg('#7042a5')"></button>
        <button class="color-btn" style="background:red" onclick="changeBg('red')"></button>
        <button class="color-btn" style="background:blue" onclick="changeBg('blue')"></button>
        <button class="color-btn" style="background:green" onclick="changeBg('green')"></button>
        <button class="color-btn" style="background:yellow" onclick="changeBg('yellow')"></button>
        <button class="color-btn" style="background:pink" onclick="changeBg('pink')"></button>
        <button class="color-btn" style="background:orange" onclick="changeBg('orange')"></button>
        <button class="color-btn" style="background:black" onclick="changeBg('black')"></button>
        <button class="color-btn" style="background:purple" onclick="changeBg('purple')"></button>
        <button class="color-btn" style="background:white" onclick="changeBg('white')"></button>
        <button class="color-btn" style="background:gray" onclick="changeBg('gray')"></button>
    </div>

    <div class="card">
        <h2>Text Color</h2>

        <button class="color-btn" style="background:red" onclick="changeText('red')"></button>
        <button class="color-btn" style="background:blue" onclick="changeText('blue')"></button>
        <button class="color-btn" style="background:green" onclick="changeText('green')"></button>
        <button class="color-btn" style="background:black" onclick="changeText('black')"></button>
        <button class="color-btn" style="background:purple" onclick="changeText('purple')"></button>
        <button class="color-btn" style="background:orange" onclick="changeText('orange')"></button>
        <button class="color-btn" style="background:pink" onclick="changeText('pink')"></button>
    </div>

    <div class="card">
        <h2>Font Style</h2>

        <button class="font-btn" onclick="changeFont('Arial')">Arial</button>
        <button class="font-btn" onclick="changeFont('Georgia')">Georgia</button>
        <button class="font-btn" onclick="changeFont('Courier New')">Courier</button>
        <button class="font-btn" onclick="changeFont('Times New Roman')">Times</button>
        <button class="font-btn" onclick="changeFont('Verdana')">Verdana</button>
    </div>

</div>

<script>
let editor = document.getElementById("editor");

function changeBg(color) {
    editor.style.backgroundColor = color;
}

function changeText(color) {
    editor.style.color = color;
}

function changeFont(font) {
    editor.style.fontFamily = font;
}

function downloadText() {
    let text = editor.innerText;
    let blob = new Blob([text], {
        type: "text/plain"
    });

    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "MyText.txt";
    link.click();

    URL.revokeObjectURL(link.href);
}
</script>

</body>
</html>
